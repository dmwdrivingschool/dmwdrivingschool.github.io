<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMW Portal Control Panel - Admin Only</title>
    <style>
        :root { 
            --dmw-dark: #1e1e24; 
            --dmw-accent: #ffcc00; 
            --dmw-blue: #0084ff; 
            --dmw-bg: #f8f9fa; 
            --card-bg: #ffffff; 
            --text-dark: #1e293b; 
            --border-light: #e2e8f0; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--dmw-bg); color: var(--text-dark); line-height: 1.5; padding-bottom: 80px; }
        
        .site-header { background-color: var(--dmw-dark); padding: 14px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.12); text-align: center; }
        .logo-container { max-width: 210px; margin: 0 auto; }
        .logo-img { width: 100%; height: auto; display: block; }
        
        .admin-wrapper { max-width: 800px; margin: 40px auto; padding: 0 20px; display: none; }
        .portal-banner { display: flex; justify-content: space-between; align-items: center; background: var(--dmw-dark); color: #fff; padding: 22px 30px; border-radius: 10px; margin-bottom: 30px; }
        .portal-banner h1 { font-size: 1.35rem; font-weight: 700; }
        .logout-btn { background: transparent; color: var(--dmw-accent); border: 2px solid var(--dmw-accent); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .logout-btn:hover { background: var(--dmw-accent); color: var(--dmw-dark); }
        .grid-panels { display: grid; gap: 30px; grid-template-columns: 1fr; }
        @media(min-width: 700px) { .grid-panels { grid-template-columns: 1fr 1fr; } }
        
        .panel-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-light); padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .panel-card h2 { font-size: 1.15rem; font-weight: 700; color: var(--dmw-dark); margin-bottom: 15px; border-bottom: 2px solid var(--dmw-bg); padding-bottom: 8px; }
        
        .input-item { margin-bottom: 15px; }
        .input-item label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; }
        .input-item input { width: 100%; padding: 11px 14px; border: 1px solid var(--border-light); border-radius: 6px; outline: none; font-size: 0.95rem; }
        .input-item input:focus { border-color: var(--dmw-dark); }
        .action-btn { width: 100%; padding: 12px; border: none; font-weight: 700; font-size: 0.95rem; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .btn-add { background: #2ecc71; color: white; }
        .action-btn:hover { opacity: 0.9; }
        
        .student-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--dmw-bg); border-radius: 6px; margin-bottom: 10px; font-size: 0.95rem; font-weight: 500; border-left: 4px solid var(--dmw-dark); }
        .student-list-item span { color: var(--text-dark); line-height: 1.4; }
        .student-list-item strong { color: #0f172a; font-weight: 600; }
        .delete-icon { color: #df4744; cursor: pointer; font-weight: 700; font-size: 0.88rem; padding: 4px 10px; border: 1px solid #fca5a5; border-radius: 4px; background: #fff; transition: all 0.2s; }
        .delete-icon:hover { background: #fef2f2; }
        .gate-lock-box { background: var(--card-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; margin: 100px auto; border-top: 5px solid var(--dmw-dark); }
        .gate-lock-box h2 { font-size: 1.45rem; margin-bottom: 6px; font-weight: 700; }
        .gate-lock-box p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; }
        
        .site-footer { background-color: var(--dmw-dark); color: #94a3b8; padding: 24px 0; font-size: 13.5px; border-top: 1px solid #272730; position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; align-items: center; padding: 0 20px; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo-container">
                <img src="image-1.jpg" alt="DMW Logo" class="logo-img">
            </div>
        </div>
    </header>

    <div id="admin-gate-screen" class="gate-lock-box">
        <h2>Admin Gateway</h2>
        <p>Enter your master security password to open controls</p>
        <div class="input-item"><input type="password" id="admin-gate-pass" placeholder="Master Password"></div>
        <button class="action-btn btn-add" style="background: var(--dmw-dark); color: white;" onclick="verifyAdminGate()">Unlock Dashboard</button>
        <div id="gate-error" style="color: #df4744; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: 600;">Incorrect master password!</div>
    </div>
    <main class="admin-wrapper" id="admin-dashboard">
        <div class="portal-banner">
            <h1>DMW Student Accounts Dashboard</h1>
            <button class="logout-btn" onclick="lockAdminGate()">Lock Panel</button>
        </div>
        
        <div class="grid-panels">
            <div class="panel-card">
                <h2>Add New Learner Account</h2>
                <div class="input-item">
                    <label>Assigned Username</label>
                    <input type="text" id="new-username" placeholder="e.g. johnsmith" autocomplete="off">
                </div>
                <div class="input-item">
                    <label>Assigned Password</label>
                    <input type="text" id="new-password" placeholder="e.g. pass123" autocomplete="off">
                </div>
                <button class="action-btn btn-add" onclick="addNewStudent()">Save Student Account</button>
            </div>
            
            <div class="panel-card">
                <h2>Active Student Database Roster</h2>
                <div id="live-roster-mount">Loading cloud database entries...</div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2018 DMW Driving School | Grade A Approved Driving Instructor | Gloucester</p>
        </div>
    </footer>
    <script>
        // --- ⚙️ CONNECTED LIVE DATABASE STRINGS LINK LAYOUT ⚙️ ---
const SUPABASE_URL = "https://cxcqmyxbpjueezapknim.supabase.co";
const SUPABASE_KEY = "sb_publishable_Jacfo8kcszt-6CGfnJnydA_rgtSlI9B";

        // Upgraded Secure Cloud Database Gateway Validation Engine
        async function verifyAdminGate() {
            const inputPass = document.getElementById('admin-gate-pass').value.trim();

            if (!inputPass) {
                alert("Please enter a passcode.");
                return;
            }

            try {
                const fetchUrl = SUPABASE_URL + "/rest/v1/credentials?select=*";
                
                const response = await fetch(fetchUrl, {
                    method: 'GET',
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': 'Bearer ' + SUPABASE_KEY 
                    }
                });

                const records = await response.json();
                
                let accessGranted = false;
                if (records && records.length > 0) {
                    const adminRow = records.find(r => r.role === 'admin');
                    if (adminRow && adminRow.password === inputPass) {
                        accessGranted = true;
                    }
                }

                if (accessGranted) {
                    document.getElementById('admin-gate-screen').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'block';
                    document.getElementById('gate-error').style.display = 'none';
                    fetchLiveRoster();
                } else {
                    document.getElementById('gate-error').innerText = "Incorrect master password!";
                    document.getElementById('gate-error').style.display = 'block';
                }
            } catch (error) {
                console.error("Cloud check security error:", error);
                document.getElementById('gate-error').innerText = "Database connection error. Try again!";
                document.getElementById('gate-error').style.display = 'block';
            }
        }
        function lockAdminGate() {
            document.getElementById('admin-gate-pass').value = '';
            document.getElementById('admin-gate-screen').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
        }

        // Pull active user roster spreadsheet arrays from Cloud database
        async function fetchLiveRoster() {
            const rosterContainer = document.getElementById('live-roster-mount');
            try {
                const response = await fetch(SUPABASE_URL + "/rest/v1/students?select=*", {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                const databaseRows = await response.json();
                
                if (!databaseRows || databaseRows.length === 0) {
                    rosterContainer.innerHTML = '<p style="color: #64748b; font-size: 0.9rem; padding: 10px 0;">No active student logs found in your database.</p>';
                    return;
                }

                rosterContainer.innerHTML = '';
                databaseRows.forEach(student => {
                    const rowItem = document.createElement('div');
                    rowItem.className = 'student-list-item';
                    rowItem.innerHTML = '<div><span>User: <strong>' + student.username + '</strong></span><br><span>Pass: <strong>' + student.password + '</strong></span></div><span class="delete-icon" onclick="removeStudentAccount(\'' + student.username + '\')">✕ Delete</span>';
                    rosterContainer.appendChild(rowItem);
                });
            } catch (error) {
                rosterContainer.innerText = "Error syncing live cloud logs.";
            }
        }

        // Automated data row save execution module
        async function addNewStudent() {
            const userIn = document.getElementById('new-username').value.trim().toLowerCase();
            const passIn = document.getElementById('new-password').value.trim();

// 1. If username is empty, stop and alert
if (!userIn || userIn.trim() === "") { 
  alert("Please complete the username input field first!"); 
  return; 
}

// 2. If password field is empty, automatically create a 10-character password
if (!passIn || passIn.trim() === "") {
  const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let randomPass = "";
  for (let i = 0; i < 10; i++) {
    randomPass += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  
  // Set the password variable to our brand new 10-character string
  passIn = randomPass; 
}

            try {
                const response = await fetch(SUPABASE_URL + "/rest/v1/students", {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({ username: userIn, password: passIn })
                });

                if (response.ok) {
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    fetchLiveRoster();
                } else { alert("Failed to save data. Double check table RLS settings."); }
            } catch (e) { alert("Network upload error occurred."); }
        }

        // Automated data row wipe execution module
        async function removeStudentAccount(targetUser) {
            if (!confirm('Are you sure you want to completely delete access for: ' + targetUser + '?')) return;

            try {
                const response = await fetch(SUPABASE_URL + "/rest/v1/students?username=eq." + targetUser, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });

                if (response.ok) { fetchLiveRoster(); } else { alert("Could not delete student account."); }
            } catch (e) { alert("Network connection failure."); }
        }
    </script>
</body>
</html>
