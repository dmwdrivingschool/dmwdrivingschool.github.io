<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driving lessons</title>
<link rel="icon" type="image/png" href="drivemyway-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* This is drivemyway.co.uk/examples/classic rendered from the database instead of hardcoded.
     The examples are what a customer is shown BEFORE they buy, so they are the specification.
     Dale, 26 Sep 2026: "can't advertise it to someone then do something different." If this page
     and that page drift, we have sold one thing and delivered another.

     One page renders all three designs: only the palette, fonts and corner radius change, on a
     data-template attribute. A layout fix then reaches every instructor at once, which is the
     whole reason these are rendered rather than generated. */
  :root{
    --ink:#15202B; --muted:#5A6570; --paper:#F6F4EF; --card:#FFFFFF;
    --line:#E3DED4; --accent:#9C4517; --accent-dark:#7A360F; --accent-ink:#FFFFFF;
    --chip:#EDE7DB; --chip-ink:#6B4A2A;
    --head:"Fraunces",Georgia,serif; --body:"Public Sans",Arial,sans-serif; --radius:16px;
  }
  [data-template="bold"]{
    --ink:#FFFFFF; --muted:#9A9A9A; --paper:#0E0E0E; --card:#1A1A1A;
    --line:#2C2C2C; --accent:#D7F24A; --accent-dark:#c5e02f; --accent-ink:#111111;
    --chip:#1D1D1D; --chip-ink:#D7F24A;
    --head:"Archivo",Arial,sans-serif; --body:"Archivo",Arial,sans-serif; --radius:8px;
  }
  [data-template="calm"]{
    --ink:#26332B; --muted:#5F7367; --paper:#F4F8F4; --card:#FFFFFF;
    --line:#DCE7DD; --accent:#6E9478; --accent-dark:#3F5E48; --accent-ink:#FFFFFF;
    --chip:#E6EEE7; --chip-ink:#3F5E48;
    --head:"Nunito",Arial,sans-serif; --body:"Nunito",Arial,sans-serif; --radius:20px;
  }
  *{box-sizing:border-box;max-width:100%}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;overflow-x:hidden}
  h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-0.01em;margin:0}
  [data-template="bold"] h1,[data-template="bold"] h2{text-transform:uppercase;letter-spacing:-.03em;font-weight:900}
  a{color:var(--accent)}
  img{display:block}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}

  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:13px 22px;border-radius:calc(var(--radius) - 6px);border:0;cursor:pointer;font-family:inherit;font-size:1rem}
  .btn:hover{background:var(--accent-dark);color:var(--accent-ink)}
  .btn-quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn-quiet:hover{background:var(--chip);color:var(--ink)}

  header.site{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .nav{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;flex-grow:1;min-width:0}
  .brand a{text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:1.15rem;flex-shrink:0;overflow:hidden}
  .mark img{width:100%;height:100%;object-fit:cover}
  .brand-name{font-family:var(--head);font-weight:600;font-size:1.18rem;line-height:1.15}
  .brand-sub{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
  .nav-links{display:flex;gap:22px;font-size:.95rem;font-weight:500}
  .nav-links a{color:var(--ink);text-decoration:none}
  .nav-links a:hover{color:var(--accent)}

  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding:64px 0 56px}
  .hero.solo{grid-template-columns:1fr;max-width:760px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600}
  .hero h1{font-size:3.4rem;line-height:1.04;margin:20px 0}
  .hero p.lead{font-size:1.08rem;color:var(--muted);margin:0 0 26px}
  .hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .phone-link{font-weight:700;color:var(--ink);text-decoration:none;font-size:1.05rem}
  .shot{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(21,32,43,.09)}
  .shot img{width:100%;aspect-ratio:4/3;object-fit:cover}

  .stats{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 52px}
  .stat{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 20px}
  .stat .v{font-family:var(--head);font-size:1.05rem;font-weight:700;line-height:1}
  .stat .l{font-size:.88rem;color:var(--muted)}

  section.band{padding:60px 0;border-top:1px solid var(--line)}
  .band h2{font-size:2.1rem;margin:0 0 10px}
  .band .sub{color:var(--muted);margin:0 0 30px;max-width:640px}
  .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  .feat h3{font-size:1.12rem;margin:0 0 8px}
  .feat p{margin:0;color:var(--muted);font-size:.97rem}

  .areas{display:flex;flex-wrap:wrap;gap:10px}
  .area{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:500}

  .passes{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .pass{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pass .img{aspect-ratio:11/12;background:var(--chip);overflow:hidden}
  .pass .img img{width:100%;height:100%;object-fit:cover}
  .pass .b{padding:14px 16px}
  .pass .who{font-family:var(--head);font-weight:600}
  .pass .when{font-size:.8rem;color:var(--muted);margin-bottom:8px}
  .pass p{margin:0;font-size:.9rem;color:var(--muted)}
  .more-passes{margin-top:26px}

  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
  .price{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;text-align:center}
  .price .l{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .price .a{font-family:var(--head);font-size:2.6rem;font-weight:600;line-height:1;margin:10px 0 0}
  .price .n{color:var(--muted);font-size:.9rem;margin-top:8px}

  .socials{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .social{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:9px 18px;font-weight:600;text-decoration:none;font-size:.92rem}
  .social:hover{background:var(--accent);color:var(--accent-ink)}
  .contact-lines{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:6px 0 0;font-size:1.02rem}
  .contact-lines a{color:var(--ink);text-decoration:none;font-weight:700}
  .foot-socials{display:flex;gap:14px;justify-content:center;margin-top:12px}
  .foot-socials a{color:var(--muted);text-decoration:none;font-weight:600}
  .enquire{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;text-align:center}
  .enquire .sub{margin:10px auto 22px}

  footer.site{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:.9rem;text-align:center}
  .loading,.gone{padding:80px 20px;text-align:center;color:var(--muted)}
  .app-band{padding:60px 0;border-top:1px solid var(--line)}
  /* Home page gets a light mention, not the full block. Dale, 26 Sep: "more simple and then the
     tab which shows everything." Five features and three phones above the prices was the app
     selling itself on somebody else's website. */
  .app-strip{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px}
  .app-strip .shots{display:flex;gap:8px}
  .app-strip .shots img{width:72px;border-radius:10px;border:2px solid var(--ink);background:var(--ink)}
  .app-strip h3{font-size:1.25rem;margin:0 0 4px}
  .app-strip p{margin:0;color:var(--muted);font-size:.96rem}
  .app-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:8px}
  .app-feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  .app-feat .ic{font-size:1.5rem;line-height:1;margin-bottom:10px}
  .app-feat h3{font-size:1.08rem;margin:0 0 8px}
  .app-feat p{margin:0;color:var(--muted);font-size:.96rem}
  @media(max-width:760px){.app-strip{grid-template-columns:1fr;text-align:center}.app-strip .shots{justify-content:center}}
  .page-head{padding:54px 0 10px}
  .page-head h1{font-size:2.6rem}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:34px;padding:40px 0}
    .hero h1{font-size:2.3rem}
    .passes{grid-template-columns:repeat(2,1fr)}
    .nav-links{display:none}
    .band h2{font-size:1.65rem}
    section.band{padding:42px 0}
    .page-head h1{font-size:1.9rem}
  }
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>

<script src="app-showcase.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://cxcqmyxbpjueezapknim.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4Y3FteXhicGp1ZWV6YXBrbmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDUxNzAsImV4cCI6MjEwMTY4MTE3MH0.Qk46wzUGpDHlsqGvsImE9HdrrosL3ERKVbxDUsP4A30";
  var q = new URLSearchParams(location.search);
  var uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var root = document.getElementById("root");
  var esc = function(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  function gone(){ root.innerHTML = '<div class="gone">This page isn’t available.</div>'; }

  // Found by their own domain, by a DMW subdomain, or by id while previewing from the Control
  // Centre before any DNS exists.
  var sub = (q.get("s") || "").trim();
  var id  = (q.get("i") || "").trim();
  var page = (q.get("page") || "").trim();
  var dom = "";
  if (!sub && !id) {
    var host = location.hostname.toLowerCase();
    if (/\.drivemyway\.co\.uk$/i.test(host) && host.split(".").length > 3) {
      sub = host.split(".")[0];
    } else if (host !== "localhost" && host.indexOf(".") > 0) {
      dom = host;
    }
  }
  if (!sub && !dom && (!id || !uuid.test(id))) return gone();

  // Keeps whichever of ?s= / ?i= got us here, so links between pages do not lose the site.
  function urlFor(p){
    var base = location.pathname + "?";
    var parts = [];
    if (sub) parts.push("s=" + encodeURIComponent(sub));
    else if (id) parts.push("i=" + encodeURIComponent(id));
    if (q.get("preview") === "1") parts.push("preview=1");
    if (p) parts.push("page=" + p);
    return parts.length ? base + parts.join("&") : location.pathname;
  }

  // Instructors type "50", not "£50".
  function money(v){
    var t = String(v == null ? "" : v).trim();
    if (!t) return "";
    return /^[0-9]/.test(t) ? "£" + t : t;
  }
  // "Passed in September" reads like a person; "2026-09-04" reads like a database.
  function passedLabel(iso){
    if (!iso) return "";
    var dt = new Date(String(iso).slice(0,10) + "T12:00:00");
    if (isNaN(dt.getTime())) return "";
    return "Passed in " + dt.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  }

  // Preview: the owner looking at their own work before it is live. admin.html is on this same
  // origin, so its session is already in localStorage — no second sign-in, and no way to see
  // anybody else's site, because the function only ever returns yours.
  var token = null;
  if (q.get("preview") === "1") {
    try {
      for (var k = 0; k < localStorage.length; k++) {
        var key = localStorage.key(k);
        if (key && /^sb-.*-auth-token$/.test(key)) {
          var parsed = JSON.parse(localStorage.getItem(key) || "{}");
          if (parsed && parsed.access_token) { token = parsed.access_token; break; }
        }
      }
    } catch (e) { /* private mode, or no session — falls through to the public read */ }
  }

  var rpc = token ? "instructor_site_preview" : "instructor_site_public";
  var payload = token ? {} : { p_domain: dom || null, p_subdomain: sub || null, p_instructor: (sub || dom) ? null : id };

  fetch(SUPABASE_URL + "/rest/v1/rpc/" + rpc, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + (token || SUPABASE_ANON), "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ d ? draw(d) : gone(); })
    .catch(gone);

  // Their own Facebook, Instagram and TikTok. Most instructors already have these and they are
  // where their existing work lives, so a site that ignores them looks like it replaced something
  // rather than joined it up.
  var SOCIALS = [["facebook","Facebook"],["instagram","Instagram"],["tiktok","TikTok"],["google","Google reviews"]];
  function socialLinks(c, cls){
    var out = [];
    SOCIALS.forEach(function(sp){
      var url = (c.social && c.social[sp[0]]) || "";
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      out.push('<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener">' + sp[1] + '</a>');
    });
    return out.join("");
  }

  var SHOT = "https://web.drivemyway.co.uk/app-screenshots/";
  // From Dale's own app-features page, written for a pupil rather than an instructor. The last
  // three are Premium, so a Basic instructor's page simply does not list them.
  var APP_FEATURES = [
    ["🗺️","Watch your instructor arrive","As soon as your instructor sets off you get a message with their arrival time. Once they are close by, the app switches to a live map showing where they are. No more standing at the window wondering.",false],
    ["📅","Your lessons, offers and credit in one place","Your home screen shows your upcoming lessons and how many hours of credit you have. If a slot comes up, your instructor can offer it and you accept or decline with one tap.",false],
    ["🗓️","Holidays, both ways","Add your holiday in the app and it shows in your instructor's diary straight away, so nothing gets booked while you are away. When they are away, you see that too.",false],
    ["💬","Messages that do not get lost","Message your instructor in the app, send photos, and get a notification when there is a reply. Anything important shows when you open the app.",false],
    ["🎓","Theory practice and mock tests","Practice questions by topic, mock tests marked like the real thing at the real pass mark, and road signs to learn, with your progress saved as you go.",true],
    ["🎬","Videos to watch between lessons","Short videos on moving off, junctions, roundabouts and manoeuvres, so you can go over what you have learnt before your next lesson.",true],
    ["📖","The full Highway Code in your pocket","The official Highway Code, split into sections you can open any time. No separate app, no searching for it online.",true]
  ];

  function passCard(p){
    var when = passedLabel(p.passed_on);
    // Older photos imported from an instructor's own gallery have no name, date or words. Drawing
    // the caption anyway left an empty strip under every one of them.
    var body = (p.first_name || when || p.words)
      ? '<div class="b">' +
        (p.first_name ? '<div class="who">' + esc(p.first_name) + '</div>' : '') +
        (when ? '<div class="when">' + esc(when) + '</div>' : '') +
        (p.words ? '<p>' + esc(p.words) + '</p>' : '') + '</div>'
      : '';
    return '<div class="pass"><div class="img">' +
      (p.photo_url ? '<img src="' + esc(p.photo_url) + '" alt="" loading="lazy">' : '') +
      '</div>' + body + '</div>';
  }

  function draw(d){
    var c = d.content || {};
    if (d.preview && !d.published) {
      var bar = document.createElement("div");
      bar.textContent = "Preview — this is not live yet. Press “Put it live” in your Control Centre when you are happy with it.";
      bar.style.cssText = "background:#111;color:#fff;text-align:center;padding:10px 16px;font:600 14px/1.4 system-ui,sans-serif";
      document.body.insertBefore(bar, document.body.firstChild);
    }

    var name = d.name || "Driving lessons";
    document.documentElement.setAttribute("data-template", d.template || "classic");
    if (d.accent) document.documentElement.style.setProperty("--accent", d.accent);

    var initials = name.split(/\s+/).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase();
    var areas  = Array.isArray(c.areas) ? c.areas : [];
    var prices = Array.isArray(c.prices) ? c.prices : [];
    var feats  = Array.isArray(c.features) ? c.features.filter(function(f){ return f && (f.title || f.text); }) : [];
    var passes = Array.isArray(d.passes) ? d.passes : [];
    var stats  = c.stats || {};
    var gearbox = c.gearbox === "automatic" ? "Automatic" : c.gearbox === "both" ? "Manual and automatic" : "Manual";
    var enquiry = "https://web.drivemyway.co.uk/enquiry-form.html?i=" + encodeURIComponent(d.instructor_id);

    var navBits = [];
    if (feats.length)  navBits.push('<a href="' + urlFor("") + '#about">About</a>');
    if (areas.length)  navBits.push('<a href="' + urlFor("") + '#areas">Areas</a>');
    if (prices.length) navBits.push('<a href="' + urlFor("") + '#prices">Prices</a>');
    if (passes.length) navBits.push('<a href="' + urlFor("passes") + '">Passes</a>');
    navBits.push('<a href="' + urlFor("app") + '">The app</a>');

    var header =
      '<header class="site"><div class="wrap nav">' +
        '<div class="brand"><a href="' + urlFor("") + '"><div class="mark">' +
          (d.logo_url ? '<img src="' + esc(d.logo_url) + '" alt="">' : esc(initials)) +
        '</div><div><div class="brand-name">' + esc(name) + '</div>' +
        '<div class="brand-sub">' + esc(gearbox) + ' tuition</div></div></a></div>' +
        (navBits.length ? '<nav class="nav-links">' + navBits.join("") + '</nav>' : '') +
        '<a class="btn" href="' + enquiry + '">Enquire now</a>' +
      '</div></header>';

    var footer =
      '<footer class="site"><div class="wrap">' + esc(name) +
        (c.phone ? " · " + esc(c.phone) : "") +
        (c.email ? " · " + esc(c.email) : "") +
        (socialLinks(c, "") ? '<div class="foot-socials">' + socialLinks(c, "") + '</div>' : '') +
        '<br><a href="https://drivemyway.co.uk">Website by Drive My Way</a></div></footer>';

    // A page of every pass. Seventy-odd photos do not belong on a home page, but they are the best
    // thing an instructor has, so they get a page of their own with the lot on it.
    if (page === "passes") {
      document.title = "Recent passes — " + name;
      root.innerHTML = header +
        '<div class="wrap"><section class="page-head"><h1>Recent passes</h1>' +
        '<p class="sub">Every one of them, added the day they passed.</p></section>' +
        '<section class="band" style="border-top:0;padding-top:0"><div class="passes">' +
          passes.map(passCard).join("") +
        '</div><div class="more-passes"><a class="btn btn-quiet" href="' + urlFor("") + '">← Back to the main page</a></div>' +
        '</section></div>' + footer;
      return;
    }

    // The whole app, on its own page. The home page only teases it — five features and three
    // phones above somebody's prices is the app selling itself on their website.
    if (page === "app") {
      document.title = "The Drive My Way app — " + name;
      var feats = APP_FEATURES.filter(function(f){ return d.premium !== false || !f[3]; });
      root.innerHTML = header +
        '<div class="wrap"><section class="page-head"><h1>Your lessons, in one app</h1>' +
        '<p class="sub">' + esc(name) + '’s pupils use the free Drive My Way app. ' +
        'Once you start lessons you get your own login, on iPhone or Android, at no cost to you.</p></section>' +
        '<section class="band" style="border-top:0;padding-top:0">' +
          (typeof buildAppShowcaseSnippet === "function" ? buildAppShowcaseSnippet(name, d.premium !== false) : "") +
        '</section>' +
        '<section class="band"><h2>What you can do in it</h2><div class="app-feats">' +
          feats.map(function(f){
            return '<div class="app-feat"><div class="ic">' + f[0] + '</div>' +
              '<h3>' + esc(f[1]) + '</h3><p>' + esc(f[2]) + '</p></div>';
          }).join("") +
        '</div></section>' +
        '<section class="band"><div class="enquire"><h2>Ready to get started?</h2>' +
          '<p class="sub">Get in touch and I will sort your lessons out. The app comes with them.</p>' +
          '<a class="btn" href="' + enquiry + '">Enquire now</a></div></section>' +
        '<div class="more-passes" style="padding-bottom:40px"><a class="btn btn-quiet" href="' + urlFor("") + '">← Back to the main page</a></div>' +
        '</div>' + footer;
      return;
    }

    document.title = name + (c.town ? " — driving lessons in " + c.town : "");

    // Only sections with something in them are drawn. A half-filled site should look short, never
    // broken, and never show an empty heading.
    var statCells = [];
    if (stats.years) statCells.push([stats.years, (/^\d+$/.test(String(stats.years)) ? "years teaching" : "teaching")]);
    statCells.push([gearbox, "dual-controlled car"]);

    root.innerHTML = header +
      '<div class="wrap">' +
      // No photo means no empty box holding space for one; the hero goes full width instead.
      '<section class="hero' + (c.photo_url ? '' : ' solo') + '"><div>' +
        '<span class="chip">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
          'DVSA approved instructor</span>' +
        '<h1>' + esc(c.tagline || ("Learn to drive" + (c.town ? " in " + c.town : ""))) + '</h1>' +
        (c.about ? '<p class="lead">' + esc(c.about) + '</p>' : '') +
        '<div class="hero-actions"><a class="btn" href="' + enquiry + '">Book your first lesson</a>' +
        (c.phone ? '<a class="phone-link" href="tel:' + esc(String(c.phone).replace(/\s/g,"")) + '">' + esc(c.phone) + '</a>' : '') +
        '</div></div>' +
        (c.photo_url ? '<div class="shot"><img src="' + esc(c.photo_url) + '" alt=""></div>' : '') +
      '</section>' +

      '<section class="stats">' + statCells.map(function(s){
        return '<div class="stat"><div class="v">' + esc(s[0]) + '</div><div class="l">' + esc(s[1]) + '</div></div>';
      }).join("") + '</section>' +

      (feats.length ? '<section class="band" id="about"><h2>' + esc(c.about_heading || "More than just passing your test") + '</h2>' +
        (c.about_sub ? '<p class="sub">' + esc(c.about_sub) + '</p>' : '') +
        '<div class="three">' + feats.map(function(f){
          return '<div class="feat"><h3>' + esc(f.title || "") + '</h3><p>' + esc(f.text || "") + '</p></div>';
        }).join("") + '</div></section>' : '') +

      // Four on the home page, the rest on their own page. Dale, 26 Sep: the wall is the best thing
      // they have, but not seventy photos before anybody has read the prices.
      (passes.length ? '<section class="band" id="passes"><h2>Recent passes</h2>' +
        '<p class="sub">Added the day they passed, in their own words.</p><div class="passes">' +
        passes.slice(0, 4).map(passCard).join("") + '</div>' +
        (passes.length > 4 ? '<div class="more-passes"><a class="btn btn-quiet" href="' + urlFor("passes") +
          '">See all ' + passes.length + ' passes</a></div>' : '') +
        '</section>' : '') +

      (areas.length ? '<section class="band" id="areas"><h2>Where I teach</h2>' +
        '<p class="sub">Not sure if I cover you? Just ask.</p><div class="areas">' +
        areas.map(function(a){ return '<span class="area">' + esc(a) + '</span>'; }).join("") +
        '</div></section>' : '') +

      (prices.length ? '<section class="band" id="prices"><h2>Prices</h2><div class="prices">' +
        prices.map(function(pr){
          return '<div class="price"><div class="l">' + esc(pr.label || "") + '</div>' +
            '<div class="a">' + esc(money(pr.amount)) + '</div>' +
            (pr.note ? '<div class="n">' + esc(pr.note) + '</div>' : '') + '</div>';
        }).join("") + '</div></section>' : '') +

      // Drive My Way's own block, on every site. Shared with the Control Centre's embed builder so
      // the two cannot drift.
      '<section class="app-band"><div class="app-strip">' +
        '<div class="shots">' +
          '<img src="' + SHOT + 'pupil-tracking-map.jpg" alt="" loading="lazy">' +
          '<img src="' + SHOT + 'pupil-home-lessons.jpg" alt="" loading="lazy">' +
        '</div>' +
        '<div><h3>Your own app, free with your lessons</h3>' +
        '<p>Watch me arrive on a map, see your lessons and credit, and message me between them.</p></div>' +
        '<a class="btn btn-quiet" href="' + urlFor("app") + '">See what is in it</a>' +
      '</div></section>' +

      '<section class="band" id="enquire"><div class="enquire"><h2>Ready to get started?</h2>' +
        '<p class="sub">Fill this in and it comes straight through to me. ' +
        'I’ll get back to you with when I can fit you in.</p>' +
        '<a class="btn" href="' + enquiry + '">Enquire now</a>' +
        ((c.phone || c.email) ? '<div class="contact-lines">' +
          (c.phone ? '<a href="tel:' + esc(String(c.phone).replace(/\s/g,"")) + '">' + esc(c.phone) + '</a>' : '') +
          (c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : '') +
        '</div>' : '') +
        (socialLinks(c, "social") ? '<div class="socials">' + socialLinks(c, "social") + '</div>' : '') +
        '</div></section>' +
      '</div>' + footer;
  }
})();
</script>
</body>
</html>
