<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driving lessons</title>
<link rel="icon" type="image/png" href="drivemyway-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,WONK@9..144,500,0;9..144,600,0;9..144,700,0&family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* This is drivemyway.co.uk/examples/classic rendered from the database instead of hardcoded.
     The examples are what a customer is shown BEFORE they buy, so they are the specification.
     Dale, 26 Sep 2026: "can't advertise it to someone then do something different." If this page
     and that page drift, we have sold one thing and delivered another.

     One page renders all three designs: only the palette, fonts and corner radius change, on a
     data-template attribute. A layout fix then reaches every instructor at once, which is the
     whole reason these are rendered rather than generated. */
  :root{
    --ink:#15202B; --muted:#5A6570; --paper:#F6F4EF; --card:#FFFFFF;
    --line:#E3DED4; --accent:#9C4517; --accent-dark:#7A360F; --accent-ink:#FFFFFF;
    --chip:#EDE7DB; --chip-ink:#6B4A2A;
    --head:"Fraunces",Georgia,serif; --body:"Public Sans",Arial,sans-serif; --radius:16px;
  }
  [data-template="bold"]{
    --ink:#FFFFFF; --muted:#9A9A9A; --paper:#0E0E0E; --card:#1A1A1A;
    --line:#2C2C2C; --accent:#D7F24A; --accent-dark:#c5e02f; --accent-ink:#111111;
    --chip:#1D1D1D; --chip-ink:#D7F24A;
    --head:"Archivo",Arial,sans-serif; --body:"Archivo",Arial,sans-serif; --radius:8px;
  }
  [data-template="calm"]{
    --ink:#26332B; --muted:#5F7367; --paper:#F4F8F4; --card:#FFFFFF;
    --line:#DCE7DD; --accent:#6E9478; --accent-dark:#3F5E48; --accent-ink:#FFFFFF;
    --chip:#E6EEE7; --chip-ink:#3F5E48;
    --head:"Nunito",Arial,sans-serif; --body:"Nunito",Arial,sans-serif; --radius:20px;
  }
  *{box-sizing:border-box;max-width:100%}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;overflow-x:hidden}
  /* WONK is Fraunces' "wonky" alternates: a curled j, a hooked f, a cocked y. Dale, 26 Sep:
     "some of the font is wierd - look at j and f". It is on by default, which is a lovely thing
     on a poster and a distraction on a driving instructor's headline, so it is pinned off here and
     in the font request. */
  h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-0.01em;margin:0;font-variation-settings:"WONK" 0,"SOFT" 0}
  .brand-name,.mark,.pass .who,.price .a{font-variation-settings:"WONK" 0,"SOFT" 0}
  [data-template="bold"] h1,[data-template="bold"] h2{text-transform:uppercase;letter-spacing:-.03em;font-weight:900}
  a{color:var(--accent)}
  img{display:block}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}
  .legal{max-width:680px}
  .legal h2{font-size:1.15rem;margin:26px 0 6px}
  .legal p{color:var(--muted);line-height:1.65;margin:0}
  /* Classic reads better held in a bit; Bold and Calm keep the full width (Dale, 27 Sep). */
  [data-template="classic"] .wrap{max-width:960px}

  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:13px 22px;border-radius:calc(var(--radius) - 6px);border:0;cursor:pointer;font-family:inherit;font-size:1rem}
  .btn:hover{background:var(--accent-dark);color:var(--accent-ink)}
  .btn-quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn-quiet:hover{background:var(--chip);color:var(--ink)}

  header.site{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .nav{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;flex-grow:1;min-width:0}
  .brand a{text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:1.15rem;flex-shrink:0;overflow:hidden}
  .mark img{width:100%;height:100%;object-fit:cover}
  /* Showing all of a logo means the square tile has to go: a wide logo letterboxed inside 40x40 is
     a postage stamp with a coloured border round it. */
  .mark.logo-fit{width:auto;max-width:150px;height:42px;background:transparent;border-radius:0}
  .mark.logo-fit img{width:auto;max-width:150px;height:100%;object-fit:contain}
  .brand-name{font-family:var(--head);font-weight:600;font-size:1.18rem;line-height:1.15}
  .brand-sub{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
  .nav-links{display:flex;gap:22px;font-size:.95rem;font-weight:500}
  /* Hidden on a desktop, where the links are already on show. */
  .burger{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin-left:auto;
          background:none;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink)}
  .burger span{display:block;width:18px;height:2px;background:currentColor;position:relative}
  .burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:currentColor}
  .burger span::before{top:-6px}
  .burger span::after{top:6px}
  .nav-links a{color:var(--ink);text-decoration:none}
  .nav-links a:hover{color:var(--accent)}
  .nav-links .nav-cta{display:none}
  /* Off on a desktop, where the hero button and the header button are both on screen already. */
  .sticky-cta{display:none}

  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:stretch;padding:64px 0 56px}
  .hero.solo{grid-template-columns:1fr;max-width:760px}
  .hero > div:first-child{display:flex;flex-direction:column}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600}
  .hero h1{font-size:3.4rem;line-height:1.04;margin:20px 0}
  .hero p.lead{font-size:1.08rem;color:var(--muted);margin:0 0 26px}
  .hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .phone-link{font-weight:700;color:var(--ink);text-decoration:none;font-size:1.05rem}
  .shot{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(21,32,43,.09)}
  /* The photo column. Dale, 26-27 Sep: "where i teach should move to below the photo" -
     literally in that column - and "so it stays level with the 10 years amd manual dual
     controlled car". Both at once: margin-top:auto drops the areas to the foot of this
     column, and .stats does the same in the other, so the two rows of chips finish on the
     same line however tall the photo is. */
  .hero > .shotcol{display:flex;flex-direction:column;align-self:stretch;min-width:0}
  .shotcol .shot{align-self:start;width:100%}
  .areas{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:auto;padding-top:30px}
  @media(max-width:900px){.areas{margin-top:18px;padding-top:0}}
  /* The three designs are three shapes, not one shape in three colour schemes (Dale, 26 Sep: "do the
     layout as advertised"). Classic puts a landscape photo beside the words; Bold runs the words full
     width with a letterbox photo under them; Calm stands a portrait next to them. Those are what the
     example pages show, and somebody choosing Bold off that page has to get Bold.

     Done in CSS rather than by branching the markup: one set of elements, three sets of rules, so a fix
     to the hero cannot land on one design and miss the other two. */
  [data-template="bold"] .hero{grid-template-columns:1fr;gap:26px}
  [data-template="bold"] .shot{border-radius:10px;box-shadow:none;margin-top:22px}
  [data-template="bold"] .shot img{aspect-ratio:21/8}
  [data-template="calm"] .hero{gap:48px}
  [data-template="calm"] .shot{border-radius:24px;border:0;box-shadow:none}
  [data-template="calm"] .shot img{aspect-ratio:4/5}
  .shot img{width:100%;aspect-ratio:4/3;object-fit:cover}
  /* nowrap and no shrink: in the chip row this was being squeezed until it broke after every
     word - "Where / I / teach" stacked three high next to the years-teaching chip. */
  .areas-label{align-self:center;color:var(--ink);font-size:1rem;font-weight:700;margin-left:0;white-space:nowrap;flex-shrink:0}
  @media(max-width:640px){.areas-label{flex-basis:100%;margin:6px 0 0}}

  /* "Show all of it" inside a fixed 4:3 frame leaves a band of empty card under the picture, which
     reads as a mistake rather than a choice. The frame takes the photo's own shape instead. */
  .shot.fit img{aspect-ratio:auto;height:auto;object-fit:contain}

  .stats{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0;margin-top:auto}
  .stat{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 20px}
  .stat .v{font-family:var(--head);font-size:1.05rem;font-weight:700;line-height:1}
  .stat .l{font-size:.88rem;color:var(--muted)}

  section.band{padding:60px 0;border-top:1px solid var(--line)}
  .band h2{font-size:2.1rem;margin:0 0 10px}
  .band .sub{color:var(--muted);margin:0 0 30px;max-width:640px}
  .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  .feat h3{font-size:1.12rem;margin:0 0 8px}
  .feat p{margin:0;color:var(--muted);font-size:.97rem}

  .areas{display:flex;flex-wrap:wrap;gap:10px}
  .area{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:500}

  .passes{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .pass{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pass .img{aspect-ratio:11/12;background:var(--chip);overflow:hidden}
  .pass .img img{width:100%;height:100%;object-fit:cover}
  .pass .b{padding:14px 16px}
  .pass .who{font-family:var(--head);font-weight:600}
  .pass .when{font-size:.8rem;color:var(--muted);margin-bottom:8px}
  .pass p{margin:0;font-size:.9rem;color:var(--muted)}
  .more-passes{margin-top:26px}

  .ptable{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .ptable th{background:var(--ink);color:var(--paper);text-align:left;font-family:var(--head);font-weight:700;font-size:.92rem;padding:14px 20px}
  .ptable th:nth-child(2){text-align:right}
  .ptable td{padding:16px 20px;border-top:1px solid var(--line);vertical-align:middle}
  .ptable tr:first-child td{border-top:0}
  .ptable td.l{font-weight:700}
  .ptable td.l .n{display:block;font-weight:400;color:var(--muted);font-size:.9rem;margin-top:2px}
  .ptable td.a{font-family:var(--head);font-size:1.5rem;font-weight:700;text-align:right;white-space:nowrap}
  @media(max-width:560px){
    .ptable th,.ptable td{padding:12px 14px}
    .ptable td.a{font-size:1.25rem}
  }

  .socials{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .social{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:9px 18px;font-weight:600;text-decoration:none;font-size:.92rem}
  .social:hover{background:var(--accent);color:var(--accent-ink)}
  .contact-lines{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:6px 0 0;font-size:1.02rem}
  .contact-lines a{color:var(--ink);text-decoration:none;font-weight:700}
  .foot-socials{display:flex;gap:14px;justify-content:center;margin-top:12px}
  .foot-socials a{color:var(--muted);text-decoration:none;font-weight:600}
  .enquire{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;text-align:center}
  .enquire .sub{margin:10px auto 22px}

  footer.site{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:.9rem;text-align:center}
  .loading,.gone{padding:80px 20px;text-align:center;color:var(--muted)}
  .app-band{padding:60px 0;border-top:1px solid var(--line)}
  /* Home page gets a light mention, not the full block. Dale, 26 Sep: "more simple and then the
     tab which shows everything." Five features and three phones above the prices was the app
     selling itself on somebody else's website. */
  .app-strip{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px}
  .app-strip .shots{display:flex;gap:8px}
  .app-strip .shots img{width:72px;border-radius:10px;border:2px solid var(--ink);background:var(--ink)}
  .app-strip h3{font-size:1.25rem;margin:0 0 4px}
  .app-strip p{margin:0;color:var(--muted);font-size:.96rem}
  .app-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:8px}
  /* Icon beside the title, not stacked above it. A plain block put the .ic div on its own line,
     which left every card opening with a floating symbol. Two columns: symbol, then heading; the
     body text spans both so it keeps the full width of the card on a phone. Baseline alignment
     sits the symbol on the heading's first line even when the heading runs to two. */
  .app-feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;
    display:grid;grid-template-columns:auto 1fr;column-gap:11px;align-items:baseline}
  .app-feat .ic{font-size:1.5rem;line-height:1.2}
  .app-feat h3{font-size:1.08rem;margin:0}
  .app-feat p{grid-column:1/-1;margin:9px 0 0;color:var(--muted);font-size:.96rem}
  /* The app's own page, drawn in the instructor's colours and fonts like every other page on
     their site. It used to render the embed card — the block we give people to paste into a
     Squarespace site — and that card carries its own heading, its own intro and its own feature
     list, so the page said everything twice and looked pasted in. Dale, 26 Sep: "this repeats
     itself - it needs to look more bespoke." The embed stays what it is, for other people's
     websites. */
  .app-hero{display:grid;grid-template-columns:1.02fr .98fr;gap:52px;align-items:center;padding:60px 0 52px}
  .app-hero h1{font-size:3rem;line-height:1.05;margin:18px 0 14px}
  .app-hero p.lead{font-size:1.06rem;color:var(--muted);margin:0 0 26px}
  .app-phones{display:flex;gap:14px;justify-content:center}
  .app-phones img{width:32%;max-width:188px;height:auto;border-radius:20px;border:4px solid var(--ink);background:var(--ink);box-shadow:0 18px 40px rgba(21,32,43,.16)}
  [data-template="bold"] .app-phones img{border-color:var(--line);box-shadow:none}
  .store{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .store img{height:46px;width:auto}
  .store-note{color:var(--muted);font-size:.88rem;margin:14px 0 0}
  .app-legal{color:var(--muted);font-size:.72rem;line-height:1.5;padding:0 0 40px;max-width:760px}
  @media(max-width:900px){
    .app-hero{grid-template-columns:1fr;gap:30px;padding:36px 0}
    .app-hero h1{font-size:2.2rem}
    .app-phones img{max-width:132px}
  }
  @media(max-width:760px){.app-strip{grid-template-columns:1fr;text-align:center}.app-strip .shots{justify-content:center}}
  /* label on the left, value on the right - the same row for Phone/Email and for the days, so
     the two blocks line up instead of looking like two different ideas. */
  .reach{display:flex;justify-content:space-between;gap:16px;margin:0;padding:11px 0;border-bottom:1px solid var(--line);max-width:420px}
  .reach span{color:var(--muted)}
  .page-head{padding:54px 0 10px}
  .page-head h1{font-size:2.6rem}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:34px;padding:40px 0}
    .hero h1{font-size:2.3rem}
    .passes{grid-template-columns:repeat(2,1fr)}
    /* The links used to be hidden here with nothing put in their place, so on a phone there was no
       way at all to reach Passes, Prices or The app - three real pages, unreachable, on a site sold
       as working properly on a phone. Dale, 27 Sep 2026: "there is no menu button? we have
       advertised it to work perfect on mobile and it doesnt". */
    .nav-links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;
               background:var(--card);border-bottom:1px solid var(--line);padding:6px 20px 14px;z-index:40}
    .nav-links.open{display:flex}
    .nav-links a{padding:13px 0;border-top:1px solid var(--line);font-size:1rem}
    .burger{display:flex}
    header.site .wrap.nav{position:relative;flex-wrap:nowrap}
    /* The header's "Enquire now" goes, and moves into the menu.
       Two reasons, and the second is the one that matters. On a phone the header button and the
       hero's "Book your first lesson" land in the same screenful doing the same job - Dale, 27 Sep
       2026: "you have an enquire now and book your first lesson in the same bit of space". And with
       a longer business name the header could not fit brand and button on one row, so the button
       wrapped to a second line with no side padding and sat flush against the edge of the screen. */
    header.site .wrap.nav > .btn{display:none}
    .nav-links .nav-cta{display:block;margin-top:12px;padding:13px 16px;border-top:0;border-radius:12px;
                        background:var(--accent);color:#fff;text-align:center;font-weight:700}
    .band h2{font-size:1.65rem}
    section.band{padding:42px 0}
    .page-head h1{font-size:1.9rem}
    /* 54px of top padding makes sense under a roomy desktop header. On a phone it left most of a
       screen empty between the header and the word Passes - and the same on Prices and The DMW
       App, since they all use .page-head. Dale: "there is a massive space from the top of page to
       the word Passes - waste of space" / "same on the prices page". */
    .page-head{padding:22px 0 6px}
  }
  /* On a phone the hero collapses to one column and these two were left looking like stray buttons:
     the number bare and left-aligned under the CTA, the pills stacked one per line at odd widths.
     Dale, 27 Sep 2026, on his own phone: "the phone number there is a bit weird in that placement"
     and the pills "a bit off". Phone only - the desktop layout is the one he set on Thursday and is
     deliberately untouched, stats and areas still finishing on the same line. */
  @media(max-width:640px){
    /* The big in-flow button goes and this takes its place: smaller, in the corner, and there the
       whole way down. Dale, 27 Sep 2026: "could we have that book your first lesson - smaller and so
       it stays in the corner as you scroll". It is the pattern from his own site's Check
       Availability pill, and it means there is always a way to book on screen rather than one that
       scrolls away after the first swipe.
       Only one CTA is visible at a time now: the header's went into the menu, and this replaces the
       hero's. */
    .hero-actions{display:none}
    .sticky-cta{display:inline-flex;align-items:center;gap:7px;position:fixed;right:14px;bottom:14px;z-index:60;
                padding:11px 16px;border-radius:9999px;background:var(--accent);color:#fff;font-weight:700;
                font-size:.92rem;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
    /* So the footer's last line is not sitting under the pill. */
    footer.site{padding-bottom:74px}
    /* Both on one line, and the label tucked up against its number.
       Dale, 27 Sep 2026: "the yrs should be closer to the 10 and instructor closer to Manual - i
       think they should also be on the same line". At the old size "10 yrs experience" and "Manual
       instructor" were together wider than the screen, so they wrapped and read as two stray
       buttons. Smaller text and tighter padding fits both across, and nowrap stops one dropping
       under the other on a narrow phone. */
    .stats{gap:8px;margin-top:0;flex-wrap:nowrap}
    .hero .lead{margin-bottom:18px}

    /* Vertical space, cut back to phone proportions.
       At 900px the hero keeps 40px top and bottom and a 34px column gap, and every band keeps 42px
       top and bottom. On a 360px screen that is around 100px of nothing between one section and the
       next - a quarter of the screen, four times over. Dale, on his own phone: the DVSA chip "too
       low", the gap to the photo "too big", and the one before "More than just passing your test"
       and again before the passes "massive".
       Desktop is untouched; this only bites below 640. */
    .hero{padding:20px 0 26px;gap:22px}
    .hero h1{margin:14px 0}
    /* .app-band is NOT .band - it is its own class at 60px, so the first pass at this left it on
       desktop spacing. Its 60px on top of the previous band's 28px is the void Dale photographed
       between "See all 6 photos and reviews" and the app card. */
    section.band,.app-band{padding:20px 0}
    /* The app page's own hero. Like .app-band it is not .hero, so it sat on the 900px value of
       36px top and bottom - the gap under the header above "Free with your lessons", and the one
       under the phone screenshots before the next rule. */
    .app-hero{padding:16px 0 20px;gap:20px}
    /* Only the heading that OPENS a band - the band's own padding already spaces it. Written as
       plain `.band h2` first, which flattened the gap before every later heading too and left
       "When I teach" welded to the email row above it on the contact page. */
    .band > h2:first-child{margin-top:0}
    .stat{padding:8px 12px;gap:4px;min-width:0}
    .stat .v{font-size:.9rem}
    .stat .l{font-size:.76rem;white-space:nowrap}

    /* Where I teach, as a plain list rather than a grid of big chips. Four place names were taking
       two rows of pills and most of a screen; Dale: "i think that should be bullet points or
       something like that". Separated by middots, which stay readable when they wrap. */
    .areas{gap:0;padding-top:16px;display:block}
    .area{background:none;border:0;border-radius:0;padding:0;font-weight:500;display:inline}
    /* The gap on the left is the real space in the markup, which is also what lets the line wrap;
       the margin only does the right-hand side. Spaces inside generated content collapse against
       the text that follows, which is why the separator lost its trailing gap first time. */
    .area:not(:last-of-type)::after{content:"·";margin-left:5px;color:var(--muted);font-weight:400}
    /* It was the same size and weight as the town names under it, so it read as part of the list
       rather than the thing introducing it. */

          '<h2>How long it is kept</h2>' +
          '<p>An enquiry that does not become lessons is kept while ' + esc(name) + ' still needs it and ' +
            'then removed. If you become a pupil, your records are kept for as long as you are taught and ' +
            'afterwards only where the law requires it, such as payment records for tax.</p>' +
          '<h2>Who else sees it</h2>' +
          '<p>Your details go to ' + esc(name) + '. They are not sold, and they are not shared for ' +
            'marketing. Drive My Way holds them as the software provider, and no other instructor or ' +
            'driving school can see them.</p>' +
          '<h2>Your rights</h2>' +
          '<p>You can ask for a copy of what is held about you, ask for it to be corrected or deleted, ' +
            'and withdraw any permission you have given. To do any of that, ' + reach + '. If you are not ' +
            'happy with the answer you can complain to the Information Commissioner at ' +
            '<a href="https://ico.org.uk" target="_blank" rel="noopener">ico.org.uk</a>.</p>' +
        '</section></div>' + footer;
      return;
    }

    // A page of every pass. Seventy-odd photos do not belong on a home page, but they are the best
    // thing an instructor has, so they get a page of their own with the lot on it.
    if (page === "passes") {
      document.title = passLabel + " — " + name;
      root.innerHTML = header +
        '<div class="wrap"><section class="page-head"><h1>' + esc(passLabel) + '</h1>' +
        '<p class="sub">Every photo and every review, added the day they passed.</p></section>' +
        '<section class="band" style="border-top:0;padding-top:0"><div class="passes">' +
          passes.map(passCard).join("") +
        '</div><div class="more-passes"><a class="btn btn-quiet" href="' + urlFor("") + '">← Back to the main page</a></div>' +
        '</section></div>' + footer;
      return;
    }

    // Prices on their own page, as a table rather than three cards (Dale, 26 Sep). A card each is fine
    // for three, and falls apart at six; a row each reads the same however many they have, and it is the
    // shape people already know from a price list.
    if (page === "prices") {
      document.title = "Prices — " + name;
      root.innerHTML = header +
        '<div class="wrap"><section class="page-head"><h1>Prices</h1>' +
        '<p class="sub">Everything I charge, in one place.</p></section>' +
        '<section class="band" style="border-top:0;padding-top:0">' +
          '<table class="ptable"><thead><tr><th>Lesson</th><th>Price</th></tr></thead><tbody>' +
            prices.map(function(pr){
              return '<tr><td class="l">' + esc(pr.label || "") +
                (pr.note ? '<span class="n">' + esc(pr.note) + '</span>' : '') + '</td>' +
                '<td class="a">' + esc(money(pr.amount)) + '</td></tr>';
            }).join("") +
          '</tbody></table>' +
          '<div class="more-passes"><a class="btn" href="' + enquiry + '">Enquire now</a></div>' +
        '</section>' +
        '<div class="more-passes" style="padding-bottom:40px"><a class="btn btn-quiet" href="' + urlFor("") + '">← Back to the main page</a></div>' +
        '</div>' + footer;
      return;
    }

    // The whole app, on its own page — in their colours, with one heading and one list. The
    // embed card is for somebody else's website; rendering it here repeated everything.
    if (page === "app") {
      document.title = "The Drive My Way app — " + name;
      var prem = d.premium !== false;
      var feats = APP_FEATURES.filter(function(f){ return prem || !f[3]; });
      var owner = name + (/s$/i.test(name) ? "’" : "’s");
      // Two home screenshots, because the home screen genuinely differs: the Premium one has Learning
      // Videos and Theory Practice on it and the Basic one does not. Showing the Premium shot on a
      // Basic instructor's site advertised two things their pupils would open the app and not find.
      // Dale took the Basic one on his own phone, 26 Sep.
      var phones = prem
        ? ["pupil-tracking-map.jpg", "pupil-home-lessons.jpg", "pupil-theory-practice.jpg"]
        : ["pupil-tracking-map.jpg", "pupil-home-basic.jpg", "pupil-messages.jpg"];
      root.innerHTML = header +
        '<div class="wrap">' +
        '<section class="app-hero"><div>' +
          '<span class="chip">Free with your lessons</span>' +
          '<h1>Your lessons, in one app</h1>' +
          '<p class="lead">' + esc(owner) + ' pupils get the Drive My Way app, on iPhone or Android, and ' +
            'it costs you nothing. Sending the enquiry form creates your login at the same time &mdash; you ' +
            'pick your own password on it &mdash; so you can sign in straight away and watch your enquiry ' +
            'come through.</p>' +
          '<div class="store">' +
            '<a href="https://play.google.com/store/apps/details?id=uk.co.dmwdrivingschool.instructor" target="_blank" rel="noopener">' +
              '<img src="' + SHOT + 'google-play-badge-trimmed.png" alt="Get it on Google Play" loading="lazy"></a>' +
            '<a href="https://apps.apple.com/gb/app/dmw-drive-my-way/id6803682508" target="_blank" rel="noopener">' +
              '<img src="' + SHOT + 'app-store-badge.svg" alt="Download on the App Store" loading="lazy"></a>' +
          '</div>' +
          '<p class="store-note">Already enquired? Sign in with the email and password you put on the form.</p>' +
        '</div>' +
        '<div class="app-phones">' +
          phones.map(function(f){ return '<img src="' + SHOT + f + '" alt="" loading="lazy">'; }).join("") +
        '</div></section>' +

        '<section class="band"><h2>What&rsquo;s in the app</h2>' +
        '<p class="sub">All of it, from your first lesson.</p><div class="app-feats">' +
          feats.map(function(f){
            return '<div class="app-feat"><div class="ic">' + f[0] + '</div>' +
              '<h3>' + esc(f[1]) + '</h3><p>' + esc(f[2]) + '</p></div>';
          }).join("") +
        '</div></section>' +

        '<section class="band"><div class="enquire"><h2>Ready to get started?</h2>' +
          '<p class="sub">Get in touch and I will sort your lessons out. The app comes with them.</p>' +
          '<a class="btn" href="' + enquiry + '">Enquire now</a></div></section>' +
        '<div class="more-passes" style="padding-bottom:26px"><a class="btn btn-quiet" href="' + urlFor("") + '">← Back to the main page</a></div>' +
        '<p class="app-legal">Apple and the Apple logo are trademarks of Apple Inc. Google Play and the ' +
          'Google Play logo are trademarks of Google LLC.</p>' +
        '</div>' + footer;
      return;
    }

    document.title = name + (c.town ? " — driving lessons in " + c.town : "");

    // Only sections with something in them are drawn. A half-filled site should look short, never
    // broken, and never show an empty heading.
    var statCells = [];
    // "10 yrs experience" and "Manual instructor" rather than "years teaching" and
    // "dual-controlled car" - shorter, and they then sit side by side on a phone instead of
    // stacking into two stray-looking buttons. The conditional stays: somebody who types "10 yrs"
    // gets "experience" on its own rather than "10 yrs yrs experience".
    if (stats.years) statCells.push([stats.years, (/^\d+$/.test(String(stats.years)) ? "yrs experience" : "experience")]);
    statCells.push([gearbox, "instructor"]);

    root.innerHTML = header +
      '<div class="wrap">' +
      // No photo means no empty box holding space for one; the hero goes full width instead.
      '<section class="hero' + (c.photo_url ? '' : ' solo') + '"><div>' +
        '<span class="chip">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
          'DVSA approved instructor</span>' +
        '<h1>' + esc(c.tagline || ("Learn to drive" + (c.town ? " in " + c.town : ""))) + '</h1>' +
        (c.about ? '<p class="lead">' + esc(c.about) + '</p>' : '') +
        // The number used to sit beside the button and, once the hero collapsed on a phone, ended up
        // a bare bold line floating between the button and the pills. It belongs with the other ways
        // of getting hold of them, on Contact.
        '<div class="hero-actions"><a class="btn" href="' + enquiry + '">Book your first lesson</a></div>' +
        // The stats live in this column rather than in a band of their own, so that they and the areas
        // finish at the same line. Dale, 26 Sep: "so it stays level with the 10 years amd manual dual
        // controlled car". Two rows of chips at the same height read as one row; staggered they read as
        // a mistake.
        '<div class="stats">' + statCells.map(function(st){
          return '<div class="stat"><div class="v">' + esc(st[0]) + '</div><div class="l">' + esc(st[1]) + '</div></div>';
        }).join("") + '</div>' +
        '</div>' +
        // Dale, 26 Sep, pointing at the gap beside the stats: "where i teach should move to below the
        // photo". Literally below the photo, in that column - not as its own band underneath, which is
        // what it got the first time and left the hole still sitting there.
        ((c.photo_url || areas.length) ? '<div class="shotcol">' +
          (c.photo_url ? '<div class="shot' + (c.photo_fit === "fit" ? " fit" : "") + '"><img src="' +
            esc(c.photo_url) + '" alt="" style="' + photoFitStyle(c) + '"></div>' : '') +
          (areas.length ? '<div class="areas" id="areas"><span class="areas-label">Where I teach</span>' +
            areas.map(function(a){ return '<span class="area">' + esc(a) + '</span>'; }).join(" ") + '</div>' : '') +
        '</div>' : '') +
      '</section>' +

      (feats.length ? '<section class="band" id="about"><h2>' + esc(c.about_heading || "More than just passing your test") + '</h2>' +
        (c.about_sub ? '<p class="sub">' + esc(c.about_sub) + '</p>' : '') +
        '<div class="three">' + feats.map(function(f){
          return '<div class="feat"><h3>' + esc(f.title || "") + '</h3><p>' + esc(f.text || "") + '</p></div>';
        }).join("") + '</div></section>' : '') +

      // Four on the home page, the rest on their own page. Dale, 26 Sep: the wall is the best thing
      // they have, but not seventy photos before anybody has read the prices.
      (passes.length ? '<section class="band" id="passes"><h2>' + esc(passLabel) + '</h2>' +
        '<p class="sub">Added the day they passed, in their own words.' +
          (passes.length > 4 ? ' All of them, and their reviews, are under <strong>' + esc(passLabel) + '</strong>.' : '') +
        '</p><div class="passes">' +
        passes.slice(0, 4).map(passCard).join("") + '</div>' +
        (passes.length > 4 ? '<div class="more-passes"><a class="btn btn-quiet" href="' + urlFor("passes") +
          '">See all ' + passes.length + ' photos and reviews</a></div>' : '') +
        '</section>' : '') +

      // Drive My Way's own block, on every site. Shared with the Control Centre's embed builder so
      // the two cannot drift.
      '<section class="app-band"><div class="app-strip">' +
        '<div class="shots">' +
          '<img src="' + SHOT + 'pupil-tracking-map.jpg" alt="" loading="lazy">' +
          '<img src="' + SHOT + (d.premium !== false ? 'pupil-home-lessons.jpg' : 'pupil-home-basic.jpg') + '" alt="" loading="lazy">' +
        '</div>' +
        '<div><h3>Your own app, free with your lessons</h3>' +
        '<p>Watch me arrive on a map, see your lessons and credit, and message me between them.</p></div>' +
        '<a class="btn btn-quiet" href="' + urlFor("app") + '">See what is in it</a>' +
      '</div></section>' +

      '<section class="band" id="enquire"><div class="enquire"><h2>Ready to get started?</h2>' +
        '<p class="sub">Fill this in and it comes straight through to me. ' +
        'I’ll get back to you with when I can fit you in.</p>' +
        '<a class="btn" href="' + enquiry + '">Enquire now</a>' +
        ((c.phone || c.email) ? '<div class="contact-lines">' +
          (c.phone ? '<a href="tel:' + esc(String(c.phone).replace(/\s/g,"")) + '">' + esc(c.phone) + '</a>' : '') +
          (c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : '') +
        '</div>' : '') +
        (socialLinks(c, "social") ? '<div class="socials">' + socialLinks(c, "social") + '</div>' : '') +
        '</div></section>' +
      '</div>' + footer;
  }

  /* One delegated listener rather than wiring the button after each render. draw() rebuilds the
     whole page and writes the header in three different places, so anything bound to the element
     itself would work on the first paint and quietly stop on the next. */
  document.addEventListener("click", function(e){
    var nav = document.getElementById("navlinks");
    if (!nav) return;
    var burger = e.target.closest ? e.target.closest("#burger") : null;
    if (burger){
      var open = nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }
    // Tapping a link, or anywhere off the panel, closes it. Without the first of those the menu
    // stays open behind the page you just asked for, which looks like the tap did nothing.
    if (nav.classList.contains("open")){
      nav.classList.remove("open");
      var b = document.getElementById("burger");
      if (b) b.setAttribute("aria-expanded", "false");
    }
  });
})();
</script>
</body>
</html>
